# Override Compose para usar un NFS YA montado en el host (bind-mount).
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.nfs.bind.yml up -d
#   docker compose logs -f mediabot
#
# Requiere que en el host exista ${NFS_MOUNT_BASE} apuntando al mount NFS.

services:
  mediabot-init:
    volumes:
      - type: bind
        source: ${NFS_MOUNT_BASE:?Set NFS_MOUNT_BASE}/mediabot/downloads
        target: /data/downloads
        bind:
          create_host_path: false
      - type: bind
        source: ${NFS_MOUNT_BASE:?Set NFS_MOUNT_BASE}/mediabot/saved_videos
        target: /data/saved_videos
        bind:
          create_host_path: false
      - type: bind
        source: /docker/mediabot/db
        target: /data/db
        bind:
          create_host_path: true

  mediabot:
    volumes:
      - type: bind
        source: ${NFS_MOUNT_BASE:?Set NFS_MOUNT_BASE}/mediabot/downloads
        target: /data/downloads
        bind:
          create_host_path: false
      - type: bind
        source: ${NFS_MOUNT_BASE:?Set NFS_MOUNT_BASE}/mediabot/saved_videos
        target: /data/saved_videos
        bind:
          create_host_path: false
      - type: bind
        source: /docker/mediabot/db
        target: /data/db
        bind:
          create_host_path: true
